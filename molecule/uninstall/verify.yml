---
# file: roles/veracrypt/molecule/default/verify.yml

- name: Verify
  hosts: all
  tasks:
    - name: Show OS
      ansible.builtin.debug:
        msg: "{{ ansible_facts.distribution }} - {{ ansible_facts.distribution_version }}"

    - name: Gather installed package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Assert veracrypt is not installed
      ansible.builtin.assert:
        that:
          - "'veracrypt' not in ansible_facts.packages"
        fail_msg: "veracrypt is installed"
        success_msg: "veracrypt is not installed"
