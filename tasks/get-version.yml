---
# file: roles/veracrypt/tasks/get_version.yml

- name: Check GitHub API for latest VeraCrypt release
  ansible.builtin.uri:
    url: https://api.github.com/repos/veracrypt/VeraCrypt/releases/latest
    return_content: true
    headers: >-
      {{
        {
          'Accept': 'application/vnd.github+json',
          'User-Agent': 'ansible-role-veracrypt'
        }
        | combine(
            (github_token is defined and github_token)
            | ternary({'Authorization': 'Bearer ' ~ github_token}, {})
          )
      }}
  register: veracrypt_version
  failed_when: >
    veracrypt_version.status not in [200, 403]
    or (veracrypt_version.status == 200 and veracrypt_version.json.tag_name is not defined)

- name: Set VeraCrypt version
  ansible.builtin.set_fact:
    veracrypt_package_version: "{{ veracrypt_version.json.tag_name.split('_')[1] }}"
